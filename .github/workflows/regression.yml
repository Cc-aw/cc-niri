name: Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated bundles and run regression suite
        run: node tools/check.js
