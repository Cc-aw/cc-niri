name: Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  js-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated bundles and run regression suite
        run: node tools/check.js

  native-build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    strategy:
      matrix:
        include:
          - rust-spring: "OFF"
            rust-motion: "OFF"
            rust-scroll-test: "OFF"
            rust-scroll: "OFF"
            rust-ring: "OFF"
            rust-protocol: "OFF"
          - rust-spring: "ON"
            rust-motion: "OFF"
            rust-scroll-test: "OFF"
            rust-scroll: "OFF"
            rust-ring: "OFF"
            rust-protocol: "OFF"
          - rust-spring: "OFF"
            rust-motion: "ON"
            rust-scroll-test: "OFF"
            rust-scroll: "OFF"
            rust-ring: "OFF"
            rust-protocol: "OFF"
          - rust-spring: "ON"
            rust-motion: "ON"
            rust-scroll-test: "OFF"
            rust-scroll: "OFF"
            rust-ring: "OFF"
            rust-protocol: "OFF"
          - rust-spring: "OFF"
            rust-motion: "OFF"
            rust-scroll-test: "ON"
            rust-scroll: "OFF"
            rust-ring: "OFF"
            rust-protocol: "OFF"
          - rust-spring: "OFF"
            rust-motion: "OFF"
            rust-scroll-test: "OFF"
            rust-scroll: "ON"
            rust-ring: "OFF"
            rust-protocol: "OFF"
          - rust-spring: "ON"
            rust-motion: "ON"
            rust-scroll-test: "OFF"
            rust-scroll: "ON"
            rust-ring: "OFF"
            rust-protocol: "OFF"
          - rust-spring: "OFF"
            rust-motion: "OFF"
            rust-scroll-test: "OFF"
            rust-scroll: "OFF"
            rust-ring: "ON"
            rust-protocol: "OFF"
          - rust-spring: "ON"
            rust-motion: "ON"
            rust-scroll-test: "OFF"
            rust-scroll: "ON"
            rust-ring: "ON"
            rust-protocol: "OFF"
          - rust-spring: "OFF"
            rust-motion: "OFF"
            rust-scroll-test: "OFF"
            rust-scroll: "OFF"
            rust-ring: "OFF"
            rust-protocol: "ON"
          - rust-spring: "ON"
            rust-motion: "ON"
            rust-scroll-test: "OFF"
            rust-scroll: "ON"
            rust-ring: "ON"
            rust-protocol: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          dnf install -y \
            gcc-c++ cmake ninja-build extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kcoreaddons-devel kf6-kconfig-devel kf6-ki18n-devel \
            kf6-kio-devel kf6-kitemmodels-devel \
            kf6-knotifications-devel kf6-kservice-devel \
            kf6-kwindowsystem-devel kwin-devel libplasma-devel \
            plasma-activities-devel plasma-activities-stats-devel \
            libksysguard-devel plasma-workspace-devel \
            libepoxy-devel libdrm-devel vulkan-loader-devel \
            nodejs git curl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Configure Bridge
        run: cmake -S bridge -B build/bridge -G Ninja -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Configure native viewport clip
        run: cmake -S native/viewport-clip -B build/native-viewport-clip -G Ninja -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCC_NIRI_USE_RUST_SPRING=${{ matrix.rust-spring }} -DCC_NIRI_USE_RUST_VIEWPORT_MOTION=${{ matrix.rust-motion }} -DCC_NIRI_TEST_RUST_SCROLL_RUNTIME=${{ matrix.rust-scroll-test }} -DCC_NIRI_USE_RUST_SCROLL_RUNTIME=${{ matrix.rust-scroll }} -DCC_NIRI_USE_RUST_FOCUS_RING_CORE=${{ matrix.rust-ring }} -DCC_NIRI_USE_RUST_NATIVE_PROTOCOL=${{ matrix.rust-protocol }}
      - name: Configure native focus ring
        run: cmake -S native/focus-ring -B build/native-focus-ring -G Ninja -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCC_NIRI_USE_RUST_SPRING=${{ matrix.rust-spring }} -DCC_NIRI_USE_RUST_VIEWPORT_MOTION=${{ matrix.rust-motion }} -DCC_NIRI_TEST_RUST_SCROLL_RUNTIME=${{ matrix.rust-scroll-test }} -DCC_NIRI_USE_RUST_SCROLL_RUNTIME=${{ matrix.rust-scroll }} -DCC_NIRI_USE_RUST_FOCUS_RING_CORE=${{ matrix.rust-ring }} -DCC_NIRI_USE_RUST_NATIVE_PROTOCOL=${{ matrix.rust-protocol }}
      - name: Configure Plasmoid
        run: cmake -S plasmoid/com.cc.scrolltasks -B build/plasmoid -G Ninja -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build Bridge
        run: cmake --build build/bridge
      - name: Build native viewport clip
        run: cmake --build build/native-viewport-clip
      - name: Build native focus ring
        run: cmake --build build/native-focus-ring
      - name: Build Plasmoid
        run: cmake --build build/plasmoid
      - name: Run native regression tests
        run: |
          ctest --test-dir build/bridge --output-on-failure
          ctest --test-dir build/native-viewport-clip --output-on-failure
          ctest --test-dir build/native-focus-ring --output-on-failure

  rust-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 16 and CMake dependencies
        run: dnf install -y gcc-c++ cmake ninja-build qt6-qtbase-devel curl git
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Rust unit tests
        run: cargo test --manifest-path native/rust/Cargo.toml --locked --workspace
      - name: CMake Cargo and C ABI smoke (Debug and Release)
        run: |
          for config in Debug Release; do
            cmake -S native -B "build/rust-$config" -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCC_NIRI_BUILD_KWIN_ADAPTERS=OFF -DCMAKE_BUILD_TYPE="$config"
            cmake --build "build/rust-$config"
            ctest --test-dir "build/rust-$config" --output-on-failure
          done

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --manifest-path native/rust/Cargo.toml --all --check

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - run: cargo clippy --manifest-path native/rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
